name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests never call the API, but importing the package constructs the
      # OpenAI client, which requires a key to be present.
      OPENAI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check leasehound evaluation scripts tests
      - name: Test
        run: pytest -q

  css:
    # tests/test_css.py measures computed styles in a real browser and skips itself when
    # playwright is absent — which is every environment except this job. A test that only
    # ever skips guards nothing, and these are the failures nothing else here can see:
    # a rule gradio out-specifies, a token a dark-mode block forgets, a hover that moves
    # the thing it was written to hold still. All three shipped.
    #
    # Separate from `test` because it is the only job that wants a 150MB browser. It
    # builds no vector store and makes no API call: the page it drives imports the
    # shipped UI_STYLE and lays out the same elements.
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]" playwright
          playwright install --with-deps chromium
      - name: Measure the styles
        run: pytest -q tests/test_css.py

  image:
    # The container is what visitors actually reach, and until this job existed
    # nothing built it between deploys. It fails on a different class of problem
    # than the test job: that one installs pyproject's ranges and is the canary
    # for upstream drift, this one installs the pinned set the image ships and
    # proves the pins still resolve and import together.
    #
    # The vector store is a placeholder. The real one is built from vector_db/,
    # which is not in git, and re-embedding the corpus on every commit would cost
    # money to re-prove something no commit here changes; retrieval against the
    # real store is verified locally before a deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the shipped dependency set
        # A lockfile without this step is a promise to keep shipping a fixed set
        # of versions including their vulnerabilities, and nothing else here would
        # notice. It found 44 advisories across 4 packages the first time it ran;
        # 43 were held in place by a single `gradio<6` cap in pyproject.
        #
        # --no-deps because the lockfile is already fully pinned, and this audits
        # exactly what the image installs — dev tools are not in it because they
        # are not in the container.
        #
        # The one ignored advisory is pre-authentication code injection in
        # ChromaDB's *server* API, /api/v2/tenants/.../collections with
        # trust_remote_code. This deployment embeds Chroma as a PersistentClient
        # and serves no such endpoint — the same reason the Dockerfile can drop
        # chromadb's kubernetes dependency. There is no fixed version to move to,
        # so it is named here rather than left to turn the job permanently red,
        # which is how an audit stops being read at all. Revisit if Chroma ever
        # runs as a separate service.
        run: |
          pip install pip-audit
          pip-audit --no-deps -r requirements-lock.txt \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c
      - name: Stand in for the runtime vector store
        run: mkdir -p vector_db_runtime && touch vector_db_runtime/.keep
      - name: Build
        run: docker build -t leasehound:ci .
      - name: Boot
        run: |
          docker run --rm -e OPENAI_API_KEY=ci-dummy-key \
            -v "$PWD/scripts/image_smoke_test.py:/app/smoke.py" \
            leasehound:ci python /app/smoke.py
