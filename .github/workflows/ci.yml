name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests never call the API, but importing the package constructs the
      # OpenAI client, which requires a key to be present.
      OPENAI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check leasehound evaluation scripts tests
      - name: Test
        run: pytest -q
