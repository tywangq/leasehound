# Paid evaluation runs — separate from ci.yml, which stays free (lint + tests).
#
# Three tiers, by what a run is worth against what it costs:
#
# - EVERY qualifying push runs the scan-mode retrieval eval alone: one embedding
#   per labelled clause, no completions, ~$0.0002. It answers "did the governing
#   statute reach the judge", which is the most common silent breakage and the
#   question the paid scan eval cannot separate from "did the judge misread it".
# - WEEKLY (and on dispatch) the paid tier: gold-set scan eval (6 leases, ~$0.10),
#   ask-mode retrieval eval (~$0.05), injection resistance (~$0.08). These used to
#   run per push at ~$0.23 a time, which prices a regression check by commit count
#   rather than by how often the answer can change. A weekly cadence bounds the
#   month at ~$1 and delays only the regressions the canary above cannot see —
#   and nothing here gates a merge or updates a published number anyway: the
#   README's figures come from committed artifacts, not from these runs, so the
#   cost of finding out on Monday instead of Thursday is knowing on Monday.
# - DISPATCH only: the generation eval (~$0.40) and the 40-lease silver set
#   (~$0.60).
#
# tests/test_eval_trigger.py pins the tiers, because a condition that quietly
# reverts to running everything per push is a bill, not a failing test.
#
# The rest, unchanged:
# - main only, never PRs: fork PRs must not reach the API key secret.
# - Path-filtered so docs-only commits cost nothing; results files are
#   excluded or a run would re-trigger itself when results are committed.
# - Scores are REPORTED (job summary), not gated: temperature-0 API calls
#   still drift, and a hard threshold would flake. A crash still fails.
# - Skips gracefully when the OPENAI_API_KEY secret isn't configured.
# - The vector store isn't in git; it's rebuilt from corpus/ on first run
#   (~$0.10 in embedding/augmentation calls) and cached. No size quoted here on
#   purpose: three places used to claim 42 MB and all three had gone stale.
name: Eval

on:
  push:
    branches: [main]
    paths:
      - "leasehound/**"
      # Minus the presentation layer, which cannot move a number. This filter was
      # `leasehound/**` alone, and over the 51 commits after the report panel was
      # rewritten that would have bought 38 paid runs at ~$0.23 — 28 of them for
      # commits touching only CSS, HTML rendering, or the Gradio wiring. $6.44 of the
      # $8.74 spent proving that a colour change had not altered a lease verdict.
      #
      # `judge_fingerprint()` is the reason that is knowable rather than assumed: it
      # digests the judge prompt and its schema, and no file below is in it.
      #
      # An EXCLUDE list rather than an allow list, deliberately. A new module then
      # defaults to triggering the eval, so the failure mode of forgetting one is an
      # extra $0.23 — not a regression that ships because nothing re-measured it.
      # tests/test_eval_trigger.py holds this list to the directory.
      - "!leasehound/app.py"
      - "!leasehound/api.py"
      - "!leasehound/report_html.py"
      - "!leasehound/metrics.py"
      - "!leasehound/style.css"
      - "!leasehound/assets/**"
      - "corpus/**"
      - "evaluation/*.py"
      - "evaluation/leases/**"
      - "evaluation/tests.jsonl"
      - "pyproject.toml"
      - ".github/workflows/eval.yml"
  schedule:
    # Mondays 08:00 UTC. A cadence rather than a commit count: the paid tier
    # measures whether the pipeline still scores what it scored, and that answer
    # changes when the pipeline or the provider changes, not when someone pushes.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the generation eval and the synthetic silver set"
        type: boolean
        default: true

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Gate on API key
        id: gate
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY secret not set — paid evals skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: pip install -e ".[dev]"
      - name: Restore vector store
        if: steps.gate.outputs.skip != 'true'
        id: vector-cache
        uses: actions/cache@v4
        with:
          path: vector_db
          key: vector-db-${{ hashFiles('corpus/**', 'leasehound/ingest.py') }}
      - name: Build vector store (cache miss)
        if: steps.gate.outputs.skip != 'true' && steps.vector-cache.outputs.cache-hit != 'true'
        run: python -m leasehound.ingest
      - name: Say which index these scores are against
        # The first run that had an API key scored section_hit@1 at 0.667 where the
        # committed artifact says 0.833 — on the retrieval-only eval, which makes no
        # completions. Same commit, same models, same corpus snapshot. The difference
        # was the index: this job rebuilds it from corpus/ when the cache misses, and
        # ingestion is LLM chunking that accepts a section whose validation never
        # passed (`[warning] ... accepted after 3 failed validations`). That build left
        # RCW 59.18.150 as one 9,959-character block.
        #
        # So the scores below are not comparable with the committed ones unless this
        # digest matches theirs, and now they say so instead of looking identical. A
        # cache hit reuses one index across weeks, which is what makes the weekly tier
        # a regression check rather than a sample of ingestion luck — but GitHub evicts
        # a cache unused for 7 days, so a rebuild will happen and this is how it shows.
        if: steps.gate.outputs.skip != 'true'
        run: |
          python - <<'PY' | tee index_stamp.txt
          import json
          from evaluation.provenance import index_fingerprint
          print(json.dumps(index_fingerprint(), indent=2))
          PY
          {
            echo "## Index these scores were measured against"
            echo "Cache hit: \`${{ steps.vector-cache.outputs.cache-hit }}\` — a miss means"
            echo "this index was rebuilt and is not the one the committed artifacts used."
            echo '```'
            cat index_stamp.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan-mode retrieval eval
        # First because it is the cheapest thing here by two orders of magnitude:
        # one embedding per labelled clause and no completions at all (~$0.0002).
        # It answers "did the governing statute reach the judge", which is the
        # question the paid scan eval cannot separate from "did the judge misread
        # it" — so when the gold set regresses, this says which half broke.
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m evaluation.eval_scan_retrieval | tee scan_retrieval_eval.txt
          {
            echo "## Scan-mode retrieval — governing section reaches the judge"
            echo '```'
            head -25 scan_retrieval_eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan eval (gold set)
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'push'
        run: |
          python -m evaluation.eval_scan | tee scan_eval.txt
          {
            echo "## Scan eval — gold set"
            echo '```'
            cat scan_eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retrieval eval
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'push'
        run: |
          python -m evaluation.eval_retrieval --name "ci-${GITHUB_SHA::7}" | tee retrieval_eval.txt
          {
            echo "## Retrieval eval"
            echo '```'
            tail -20 retrieval_eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generation eval (manual runs only)
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.full
        run: |
          python -m evaluation.eval_generation --name "ci-${GITHUB_SHA::7}" | tee generation_eval.txt
          {
            echo "## Generation eval"
            echo '```'
            tail -20 generation_eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Injection resistance (5 payloads)
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'push'
        run: |
          python -m evaluation.eval_injection | tee injection_eval.txt
          {
            echo "## Prompt-injection resistance"
            echo '```'
            cat injection_eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan eval — synthetic silver set (manual runs only)
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.full
        run: |
          python -m evaluation.eval_scan \
            --manifest evaluation/leases_synthetic/manifest.json \
            --results synthetic_results_ci.json | tee silver_eval.txt
          {
            echo "## Scan eval — synthetic silver set (40 leases, incl. injection)"
            echo '```'
            head -60 silver_eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
